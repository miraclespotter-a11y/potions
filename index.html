<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>معمل الوصفات السحرية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="intro-screen">
        <div class="intro-box">
            <h1>مرحبا بكم في معمل الوصفات استمتعوا</h1>
            <p>(احذروا الاقتراب من أي شيء دون إذن البروفيسور)</p>
            <p>هل أنت مستعد لبدء العمل؟</p>
            <button id="start-btn">هيا بنا</button>
        </div>
    </div>

    <div id="lab-screen" style="display: none;">
        <button id="reset-btn">تفريغ المرجل 🗑️</button>

        <div id="ingredients-shelf">
            <div class="ingredient-item" data-name="moth">
                <img src="images/ing-moth.png" alt="عثة فليتربي">
                <span>عثة فليتربي</span>
            </div>
            <div class="ingredient-item" data-name="bulb">
                <img src="images/ing-bulb.png" alt="زهرة باونسينغ بلب">
                <span>زهرة باونسينغ</span>
            </div>
            <div class="ingredient-item" data-name="foxglove">
                <img src="images/ing-foxglove.png" alt="قفاز الثعلب">
                <span>قفاز الثعلب</span>
            </div>
            <div class="ingredient-item" data-name="fangs">
                <img src="images/ing-fangs.png" alt="أنياب ثعبان">
                <span>أنياب ثعبان</span>
            </div>
            <div class="ingredient-item" data-name="slugs">
                <img src="images/ing-slugs.png" alt="بزاقات مقرنة">
                <span>بزاقات مقرنة</span>
            </div>
            <div class="ingredient-item" data-name="quills">
                <img src="images/ing-quills.png" alt="أشواك قنفذ">
                <span>أشواك قنفذ</span>
            </div>
            <div class="ingredient-item" data-name="lethe">
                <img src="images/ing-lethe.png" alt="ماء نهر ليثي">
                <span>ماء نهر ليثي</span>
            </div>
            <div class="ingredient-item" data-name="valerian">
                <img src="images/ing-valerian.png" alt="حشيشة الهر">
                <span>حشيشة الهر</span>
            </div>
            <div class="ingredient-item" data-name="mistletoe">
                <img src="images/ing-mistletoe.png" alt="حبات الهدال">
                <span>حبات الهدال</span>
            </div>
        </div>

        <div id="cauldron-area">
            <div id="cauldron-liquid">
                <div class="bubbles"></div>
            </div>
            <img src="images/cauldron-empty.png" id="cauldron-img" alt="المرجل">
            
            <div id="stir-zone" style="display: none;">
                <img src="images/stir-rod.png" id="stir-icon" alt="عود التقليب">
                <span id="stir-text">حرك في دائرة</span>
            </div>
            
            <div id="success-potion-container">
                <img id="success-potion-img" src="" alt="جرعة ناجحة">
            </div>
        </div>

        <div id="controls">
            <button id="fire-btn">أشعل النيران 🔥</button>
            <button id="start-stir-btn" style="display: none;">تنفيذ أمر التقليب 🥄</button>
            
            <button id="wand-btn" style="display: none;">
                <img src="images/magic-wand.png" id="wand-icon" alt="عصا سحرية">
                لوّح بالعصا لإنهاء الجرعة
            </button>
        </div>

        <div id="result-message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
